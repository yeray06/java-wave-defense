name: Package

# Builds the game with its own Java runtime for Windows, Linux and macOS (Construo, from Linux).
# By hand (Actions > Package > Run workflow): the zips stay as artifacts for 14 days.
# With a version tag (v0.1.0…), or by hand with a version: also a GitHub Release with the zips,
# on the repo's front page. Never on every commit: Actions minutes are limited.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish as a Release (e.g. 0.1.0). Empty: zips only, as artifacts.'
        required: false
        default: ''
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  package:
    name: Package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # only used by the release step, on tags
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK (version from .java-version)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version-file: .java-version

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Version from the tag or the input
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "game=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          elif [[ -n "$INPUT_VERSION" ]]; then
            if [[ ! "$INPUT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::The version must look like 0.1.0, got '$INPUT_VERSION'"
              exit 1
            fi
            echo "game=$INPUT_VERSION" >> "$GITHUB_OUTPUT"
            echo "tag=v$INPUT_VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "game=0.0.0-dev" >> "$GITHUB_OUTPUT"
            echo "tag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Test before packaging
        run: ./gradlew build --stacktrace

      - name: Package every target
        run: >-
          ./gradlew --stacktrace -PgameVersion=${{ steps.version.outputs.game }}
          :lwjgl3:packageWinX64 :lwjgl3:packageLinuxX64
          :lwjgl3:packageMacM1 :lwjgl3:packageMacX64

      - name: Name the zips for players
        shell: bash
        run: |
          cd build/dist
          mv java-wave-defense-winX64.zip JavaWaveDefense-Windows.zip
          mv java-wave-defense-linuxX64.zip JavaWaveDefense-Linux.zip
          mv java-wave-defense-macM1.zip JavaWaveDefense-Mac-AppleSilicon.zip
          mv java-wave-defense-macX64.zip JavaWaveDefense-Mac-Intel.zip

      - name: Upload Windows
        uses: actions/upload-artifact@v6
        with:
          name: JavaWaveDefense-Windows
          path: build/dist/JavaWaveDefense-Windows.zip
          retention-days: 14

      - name: Upload Linux
        uses: actions/upload-artifact@v6
        with:
          name: JavaWaveDefense-Linux
          path: build/dist/JavaWaveDefense-Linux.zip
          retention-days: 14

      - name: Upload macOS
        uses: actions/upload-artifact@v6
        with:
          name: JavaWaveDefense-Mac
          path: build/dist/JavaWaveDefense-Mac-*.zip
          retention-days: 14

      # By hand, gh creates the tag on the commit that was packaged.
      - name: Publish the release
        if: steps.version.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: >-
          gh release create "$TAG"
          --target "$GITHUB_SHA"
          --title "Java Wave Defense $TAG"
          --notes-file .github/release-notes.md
          --generate-notes
          build/dist/*.zip
