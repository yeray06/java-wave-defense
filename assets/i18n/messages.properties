# Textos del juego. Español por defecto. UTF-8.
# Los nombres visibles (también los tematizables) viven aquí.
# Formato MessageFormat: {0}, {1}... son argumentos. No usar comillas simples.
game.title=Defensa por oleadas

# Piezas de sintaxis de la tienda (también se usan dentro de los mensajes de error)
script.feature.IF_ELSE=if/else
