# Ajustes, guardado y errores (fase 6)
hud.panel.settings=Ajustes
settings.screen=Pantalla
settings.fullscreen.on=Pantalla completa: sí
settings.fullscreen.off=Pantalla completa: no
settings.uiScale=Tamaño de la interfaz
settings.percent={0} %
settings.codeSize=Tamaño del código (editor y manual)
settings.sizes.note=Los tamaños se aplican al momento y el código que estás escribiendo no se pierde. La interfaz solo crece hasta donde cabe: para el 150 % hace falta una ventana de 1920 × 1080 o la pantalla completa.
settings.game=Partida
settings.saved=La partida se guarda sola: al acabar cada oleada, al comprar, al cambiar el código y al cerrar. Está en {0}
settings.newGame=Nueva partida
settings.newGame.title=¿Empezar una partida nueva?
settings.newGame.text=Pierdes las estrellas, los trofeos, la sintaxis, el hardware, las oleadas superadas y el código de las torretas. Los ajustes se conservan. No se puede deshacer.
settings.newGame.yes=Empezar de cero
settings.newGame.no=Cancelar
settings.failed=No se han podido guardar los ajustes. Se aplican igualmente hasta que cierres el juego.
save.recovered=Tu partida no se podía leer y se ha recuperado la copia anterior. Puede faltar lo último que hiciste.
save.lost=No se ha podido leer tu partida y empiezas una nueva. El fichero dañado está guardado en {0}
save.failed=No se ha podido guardar la partida. Se volverá a intentar en unos segundos.
error.frame=Algo ha fallado. Está apuntado en el registro (carpeta logs) y el juego sigue.
