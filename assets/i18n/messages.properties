manual.intro=Todo lo que puede hacer una torreta, con ejemplos que puedes copiar. Lo que todavía no tienes sale con candado, para que sepas qué viene.
manual.chapter.START=Primeros pasos
manual.chapter.TURRET=Lo que hace la torreta
manual.chapter.ENEMY_CALLS=Lo que puedes preguntar a un enemigo
manual.chapter.SYNTAX=Sintaxis de Java
