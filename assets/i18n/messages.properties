manual.page.START_CYCLE.title=Cómo piensa una torreta
manual.page.START_CYCLE.body=Cada torreta ejecuta su código {ciclos} veces por segundo. Cada una de esas veces es un ciclo.\n\nEn cada ciclo el código se lee entero, de arriba abajo, y en el siguiente vuelve a empezar desde la primera línea. Una torreta que solo tiene disparar(); dispara una vez por ciclo, aunque no haya nadie a tiro.\n\nAl empezar cada ciclo, antes de ejecutar tu código, la torreta se enfría {disipacion} de calor.\n\nLas variables empiezan de cero en cada ciclo: no recuerdan nada del anterior. Lo único que la torreta recuerda entre ciclos es el enemigo al que apuntas con apuntar(e) y la munición que eliges con usarMunicion().\n\nUn ciclo se corta antes de llegar al final en dos casos: cuando llamas a recargar() y cuando salta una excepción.
manual.page.START_CYCLE.example.1=El código con el que empieza cada torreta: dispara una vez por ciclo, haya enemigos o no.
manual.page.START_EDITOR.title=El editor de código
manual.page.START_EDITOR.body=El editor se abre con el botón Código.\n\n· Cada torreta tiene su propia pestaña y su propio código. Una torreta nueva empieza con disparar(); hasta que le escribas otra cosa.\n· El juego compila mientras escribes. Si el código es correcto, debajo pone «Compila». Si no, la línea del error se marca en rojo y debajo sale el mensaje con su número de línea.\n· Mientras haya errores, la torreta sigue usando la última versión que compilaba.\n· El código nuevo entra en la próxima oleada, o en la que está esperando a «Desplegar». La oleada que ya está en marcha sigue con el código con el que empezó.\n· Las barras azules junto al número de línea marcan las instrucciones que ocupan memoria.\n\nAtajos: Ctrl+C copia, Ctrl+X corta, Ctrl+V pega, Ctrl+A selecciona todo, Ctrl+Z deshace, Ctrl+Y rehace y Tab sangra.\n\nCada ejemplo de este manual tiene un botón Copiar. Púlsalo, abre la pestaña de la torreta que quieras y pega con Ctrl+V. Para cambiar el código entero, primero selecciónalo todo con Ctrl+A.
manual.page.START_EDITOR.example.1=Todo lo que va detrás de // es un comentario: el juego lo ignora y no ocupa memoria.
manual.page.START_MEMORY.title=La memoria
manual.page.START_MEMORY.body=Cada torreta tiene {memoria} líneas de memoria. Si tu código necesita más, no compila.\n\nLo que cuenta son las instrucciones, no las líneas que ves en pantalla:\n· Ocupan una línea: cada llamada, como disparar();, cada variable que declaras, cada asignación, cada if (también cada else if) y cada while.\n· No ocupan nada: las llaves, else, los comentarios y las líneas en blanco.\n\nAsí que da igual cómo lo ordenes: escribirlo todo en una sola línea no ahorra memoria. Debajo de cada ejemplo del manual verás cuánta ocupa.
manual.page.START_MEMORY.example.1=Cinco líneas en pantalla, pero solo tres instrucciones: el if, recargar() y disparar().
manual.page.START_GAME.title=Cómo se juega
manual.page.START_GAME.body=Defiende el núcleo durante {oleadas} oleadas. La última trae al Jefe.\n\n· Antes de cada oleada nueva sale su parte: qué enemigos vienen y cuántos. Pulsa «Desplegar» cuando estés listo.\n· El núcleo aguanta {vidas} enemigos por oleada. Cada enemigo que llega le quita una vida; si se queda sin vidas, pierdes la oleada.\n· Cada enemigo derribado da dinero. Si no se cuela ninguno, la oleada es perfecta y cobras un {perfecta} % más.\n· Si pierdes, cobras lo que hayas derribado, conservas todo lo comprado y vuelves a la oleada anterior. El avance automático se apaga para que puedas repetirla hasta estar listo.\n· Con el avance automático encendido, la siguiente oleada empieza sola. Apagado, se repite la misma: sirve para ganar dinero.\n· Las velocidades rápidas, hasta ×{velocidadMax}, solo se pueden usar en oleadas que ya has superado sin que se cuele nadie.\n· Haz clic en una torreta para recargarla a mano, aunque esté colgada por una excepción.\n· En el Mapa puedes volver a cualquier oleada a la que ya hayas llegado.\n· Al acabar cada oleada se abre el Informe: el dinero, quién se coló y por dónde, y qué ha hecho cada torreta (disparos, disparos al aire, recargas y excepciones con su línea).
manual.page.START_SHOP.title=La tienda
manual.page.START_SHOP.body=En la Tienda el dinero se gasta en dos cosas:\n\n· Sintaxis: nuevas piezas de Java. Cada una desbloquea instrucciones y llamadas, y van en orden: if/else, variables, &&, || y !, y while. Al comprar una se abre una tarjeta con un ejemplo que funciona tal cual. Usar una pieza que no has comprado da el error «Aún no has desbloqueado...».\n· Hardware: mejoras para todas las torretas a la vez. El daño sube un {nivel.DAMAGE} % por nivel (cada bala hace {dano} de base), el cargador gana {nivel.MAGAZINE} balas por nivel y el disipador enfría {nivel.HEAT_SINK} de calor más por ciclo y nivel. También puedes comprar una torreta extra.\n\nEl hardware tiene un tope hasta que compras cierta sintaxis, y la tienda te dice cuál. Es a propósito: programar bien siempre rinde más que gastar en hardware.\n\nSi algo no se puede comprar, debajo pone por qué.
manual.page.CALL_FIRE.title=disparar()
manual.page.CALL_FIRE.body=Dispara una bala. Gasta una bala del cargador y sube el calor {calorNormal} ({calorPerforante} con munición perforante).\n\n¿A quién dispara? Al enemigo que fijaste con apuntar(e), si sigue vivo y a tiro. Si no, al enemigo más cercano a la torreta dentro del alcance ({alcance} unidades).\n\nSi no hay nadie a tiro, la bala sale al aire: gasta bala y calor igualmente. El Informe cuenta esos disparos al aire.\n\nPuedes llamarla varias veces en el mismo ciclo para hacer ráfagas, pero cada disparo suma calor.\n\nExcepciones que puede lanzar:\n· SinMunicionException, si el cargador está vacío.\n· SobrecalentamientoException, si el calor ya está en {calorMax}.
manual.page.CALL_FIRE.example.1=Una bala por ciclo. Es el código con el que empieza cada torreta.
manual.page.CALL_FIRE.example.2=Tres balas en el mismo ciclo: el triple de daño, pero el calor sube más rápido de lo que baja y acaba saltando SobrecalentamientoException.
manual.page.CALL_RELOAD.title=recargar()
manual.page.CALL_RELOAD.body=Recarga el cargador. La torreta queda ocupada {ciclosRecarga} ciclos sin ejecutar el código y vuelve con el cargador lleno ({cargador} balas sin mejoras). Mientras recarga, se sigue enfriando.\n\nImportante: recargar() termina el ciclo en ese mismo punto. Lo que haya escrito debajo no se ejecuta en ese ciclo.\n\nRecargar con el cargador a medias tarda lo mismo, así que conviene hacerlo cuando está vacío o cuando no hay enemigos cerca.\n\nSin if/else no puedes saber cuántas balas quedan: hasta entonces, recarga a mano haciendo clic en la torreta.
manual.page.CALL_RELOAD.example.1=La segunda línea nunca se ejecuta: recargar() termina el ciclo. Esta torreta se pasaría la oleada recargando.
manual.page.CALL_RELOAD.example.2=Recarga solo cuando el cargador está vacío; si no, dispara.
manual.page.CALL_AMMO.title=municion()
manual.page.CALL_AMMO.body=Devuelve cuántas balas quedan en el cargador: un número entero entre 0 y el tamaño del cargador ({cargador} sin mejoras).\n\nSirve para recargar justo cuando hace falta y para no llamar a disparar() con el cargador vacío, que lanza SinMunicionException.
manual.page.CALL_AMMO.example.1=El código más útil del juego: recarga cuando no quedan balas y dispara solo si hay alguien a tiro.
manual.page.CALL_HEAT.title=calor()
manual.page.CALL_HEAT.body=Devuelve el calor de la torreta: un número entero entre 0 y {calorMax}.\n\n· Cada disparo suma {calorNormal} ({calorPerforante} con munición perforante).\n· Al empezar cada ciclo, antes de tu código, baja {disipacion} (más si mejoras el disipador).\n· Si un disparo lo pasaría de {calorMax}, se queda en {calorMax}.\n· Si llamas a disparar() con el calor ya en {calorMax}, salta SobrecalentamientoException.\n\nCon un disparo por ciclo nunca llega a saltar. Vigila el calor cuando dispares varias veces en el mismo ciclo.
manual.page.CALL_HEAT.example.1=Solo dispara si el calor no está al máximo: así nunca salta SobrecalentamientoException.
manual.page.CALL_HAS_ENEMIES.title=hayEnemigos()
manual.page.CALL_HAS_ENEMIES.body=Devuelve true si hay al menos un enemigo vivo a tiro de esta torreta (a {alcance} unidades o menos) y false si no hay ninguno.\n\nEs la forma más sencilla de no disparar al aire.
manual.page.CALL_HAS_ENEMIES.example.1=Solo dispara cuando hay alguien a tiro. Ojo: no recarga, así que cuando se vacíe el cargador saltará SinMunicionException.
manual.page.CALL_NEAREST_ENEMY.title=enemigoMasCercano()
manual.page.CALL_NEAREST_ENEMY.body=Devuelve el enemigo vivo más cercano a esta torreta que esté a tiro, o null si no hay ninguno.\n\nDevuelve un Enemigo, así que se guarda en una variable de tipo Enemigo. Antes de usarlo, comprueba que no sea null: usar un null lanza NullPointerException.
manual.page.CALL_NEAREST_ENEMY.example.1=Apunta al más cercano y dispara. Si no hay nadie a tiro, no hace nada.
manual.page.CALL_TARGET.title=objetivo()
manual.page.CALL_TARGET.body=Devuelve el enemigo que fijaste con apuntar(e), o null si:\n· todavía no has fijado ninguno,\n· el que fijaste ha muerto,\n· o se ha salido del alcance.\nEn los dos últimos casos la torreta lo suelta y tendrás que fijar otro.\n\nSirve para no cambiar de objetivo en cada ciclo: acabas con un enemigo antes de pasar al siguiente.
manual.page.CALL_TARGET.example.1=Sigue con el mismo enemigo hasta acabar con él. Cuando no hay objetivo, coge el más cercano.
manual.page.CALL_AIM.title=apuntar(e)
manual.page.CALL_AIM.body=Fija el enemigo e como objetivo de la torreta. Desde ese momento, disparar() va contra él mientras siga vivo y a tiro.\n\nEl objetivo se recuerda entre ciclos: no hace falta apuntar de nuevo en cada ciclo. Puedes consultarlo con objetivo().\n\nSi e es null, salta NullPointerException.
manual.page.CALL_AIM.example.1=Comprueba que hay alguien antes de apuntar.
manual.page.CALL_AIM.example.2=Mal: si no hay nadie a tiro, enemigoMasCercano() devuelve null y apuntar(null) lanza NullPointerException.
manual.page.CALL_USE_AMMO.title=usarMunicion(tipo)
manual.page.CALL_USE_AMMO.body=Elige qué munición dispara la torreta. Se desbloquea al llegar a la oleada {oleadaMunicion}, sin comprar nada.\n\n· NORMAL: la de siempre. Suma {calorNormal} de calor por disparo. A los enemigos blindados les hace un {blindaje} % menos de daño.\n· PERFORANTE: atraviesa el blindaje y hace todo el daño. Suma {calorPerforante} de calor por disparo.\n\nLa elección se recuerda entre ciclos hasta que la cambies. Cada oleada empieza con munición NORMAL.
manual.page.CALL_USE_AMMO.example.1=Dispara siempre perforante.
manual.page.ENEMY_TYPE.title=El tipo Enemigo
manual.page.ENEMY_TYPE.body=Con variables puedes guardar enemigos: Enemigo e = enemigoMasCercano();\n\n· Una variable Enemigo puede valer null, que significa «ningún enemigo». Compruébalo con e == null o e != null.\n· Con == sabes si dos enemigos son el mismo.\n· A un enemigo le puedes preguntar cosas con un punto: e.vida(), e.velocidad(), e.blindado() y e.distanciaAlNucleo().\n· Si le preguntas algo a un enemigo que es null, salta NullPointerException.\n\nLas variables se vacían al empezar cada ciclo. Para seguir con el mismo enemigo en el ciclo siguiente, fíjalo con apuntar(e) y recupéralo con objetivo().
manual.page.ENEMY_TYPE.example.1=Los tres casos: no hay nadie, ya le estás apuntando o hay que fijarlo.
manual.page.CALL_HEALTH.title=e.vida()
manual.page.CALL_HEALTH.body=Devuelve la vida que le queda al enemigo, redondeada hacia arriba: un enemigo vivo nunca da 0.\n\nLa vida de los enemigos crece con cada oleada, y algunos tipos tienen más que otros: el Regenerador y el Blindado ×{vida.REGENERATOR}, el Jefe ×{vida.BOSS}. Cada bala hace {dano} de daño sin mejoras.
manual.page.CALL_HEALTH.example.1=Si el enemigo más cercano tiene menos vida que tu objetivo, cambia a él para rematarlo antes.
manual.page.CALL_SPEED.title=e.velocidad()
manual.page.CALL_SPEED.body=Devuelve la velocidad del enemigo en unidades por segundo. Cada tipo tiene la suya y no cambia:\n· Básico: {velocidad.BASIC}\n· Regenerador: {velocidad.REGENERATOR}\n· Blindado: {velocidad.ARMORED}\n· Enjambre: {velocidad.SWARM}\n· Jefe: {velocidad.BOSS}\n\nSirve para saber qué tipo de enemigo es o para dar prioridad a los rápidos.
manual.page.CALL_SPEED.example.1=Da prioridad a los enemigos rápidos, como el Enjambre.
manual.page.CALL_ARMORED.title=e.blindado()
manual.page.CALL_ARMORED.body=Devuelve true si el enemigo lleva blindaje en este momento.\n\nLa munición NORMAL le hace un {blindaje} % menos de daño a un enemigo blindado; la PERFORANTE le hace todo el daño. El Blindado siempre lo lleva; el Jefe se lo pone y se lo quita cada {jefeBlindaje} s, así que conviene preguntarlo en cada ciclo.
manual.page.CALL_ARMORED.example.1=Perforante solo contra blindados: el resto del tiempo el calor sube menos.
manual.page.CALL_DISTANCE_TO_CORE.title=e.distanciaAlNucleo()
manual.page.CALL_DISTANCE_TO_CORE.body=Devuelve cuánto le falta al enemigo para llegar al núcleo, en unidades de camino, redondeado hacia abajo. El camino entero mide {camino}.\n\nCuanto más pequeño, más peligroso: ese enemigo está a punto de quitarle una vida al núcleo.
manual.page.CALL_DISTANCE_TO_CORE.example.1=Si el enemigo más cercano está a menos de 300 del núcleo, deja lo que estés haciendo y ve a por él.
manual.page.SYNTAX_BASICS.title=Lo básico
manual.page.SYNTAX_BASICS.body=Lo que puedes escribir desde el principio:\n· Llamadas como disparar(); y recargar();. Cada instrucción termina en punto y coma.\n· Los paréntesis van siempre, aunque estén vacíos: disparar(); y no disparar;\n· Las mayúsculas importan: Disparar(); no existe.\n· Comentarios: lo que va detrás de // hasta el final de la línea, o entre /* y */. El juego los ignora y no ocupan memoria.\n\nEsto es Java de verdad: todo lo que el juego acepta también lo acepta Java. No hay textos entre comillas ni números con decimales, solo enteros. Lo que todavía no has comprado da el error «Aún no has desbloqueado...».
manual.page.SYNTAX_BASICS.example.1=Dos formas de escribir comentarios.
manual.page.SYNTAX_IF_ELSE.title=if/else y comparaciones
manual.page.SYNTAX_IF_ELSE.body=if ejecuta un bloque solo si se cumple una condición. else ejecuta otro bloque cuando no se cumple. else if encadena más condiciones: solo se ejecuta el primer bloque cuya condición se cumpla.\n\nComparaciones entre números: == (igual), != (distinto), <, >, <= y >=. Ojo: comparar es ==; un solo = sirve para asignar.\n\nUna condición vale true o false. Llamadas como hayEnemigos() ya devuelven true o false, así que se ponen tal cual: if (hayEnemigos()).\n\nLas llaves { } agrupan varias instrucciones. Si solo hay una, puedes quitarlas, pero con llaves es más difícil equivocarse.\n\nCon if/else también desbloqueas municion(), calor() y hayEnemigos().
manual.page.SYNTAX_IF_ELSE.example.1=Dispara solo si hay alguien a tiro.
manual.page.SYNTAX_IF_ELSE.example.2=Recarga si no quedan balas; si quedan, dispara.
manual.page.SYNTAX_IF_ELSE.example.3=Condiciones encadenadas con else if: solo se ejecuta la primera que se cumple. Un bloque puede quedarse vacío.
manual.page.SYNTAX_IF_ELSE.example.4=Lo mismo sin llaves: vale cuando cada bloque es una sola instrucción.
manual.page.SYNTAX_VARIABLES.title=Variables
manual.page.SYNTAX_VARIABLES.body=Una variable guarda un valor con un nombre para usarlo después.\n\nTipos:\n· int: un número entero, como 3 o -20.\n· boolean: true o false.\n· Enemigo: un enemigo, o null si no hay ninguno.\n\nSe declara con el tipo, el nombre y, normalmente, un valor: int balas = municion();. Después se le da otro valor con =, sin repetir el tipo: balas = 0;\n\nOperaciones con int: + - * / y % (el resto). La división es entera: 7 / 2 da 3. Dividir entre 0 lanza ArithmeticException.\n\nAtajos: n++ suma 1, n-- resta 1 y n += 5 suma 5 (también hay -=, *=, /= y %=). Las asignaciones, ++ y -- van siempre solas, como instrucción propia.\n\nLas variables se vacían al empezar cada ciclo: no recuerdan nada del anterior.\n\nCon variables también desbloqueas enemigoMasCercano(), objetivo(), apuntar(e) y las preguntas a los enemigos: e.vida(), e.velocidad(), e.blindado() y e.distanciaAlNucleo().
manual.page.SYNTAX_VARIABLES.example.1=Guarda lo que vas a usar con un nombre que se entienda.
manual.page.SYNTAX_VARIABLES.example.2=Decide cuántas veces disparar y recarga si no hay balas para todas.
manual.page.SYNTAX_VARIABLES.example.3=Operaciones con int, ++ y +=. Este no dispara: solo enseña cómo se escriben.
manual.page.SYNTAX_LOGIC_OPS.title=&&, || y !
manual.page.SYNTAX_LOGIC_OPS.body=Sirven para juntar condiciones:\n· a && b se cumple si se cumplen las dos.\n· a || b se cumple si se cumple al menos una.\n· !a es lo contrario de a.\n\nUsa paréntesis para dejar claro qué va con qué: a || (b && c).\n\nJava deja de mirar en cuanto sabe la respuesta: en a && b, si a es false, b ni se mira. Por eso e != null && e.vida() > 10 es seguro: si e es null, nunca llega a preguntar su vida.
manual.page.SYNTAX_LOGIC_OPS.example.1=Dispara solo si hay alguien a tiro y el calor está por debajo de 80.
manual.page.SYNTAX_LOGIC_OPS.example.2=Aprovecha cuando no hay nadie para recargar si quedan pocas balas.
manual.page.SYNTAX_LOGIC_OPS.example.3=Comprueba null antes de preguntar la vida, en la misma condición.
manual.page.SYNTAX_WHILE.title=while
manual.page.SYNTAX_WHILE.body=while repite un bloque mientras se cumpla su condición. Antes de cada vuelta mira la condición; cuando deja de cumplirse, sigue con lo que haya debajo.\n\nTodas las vueltas pasan dentro del mismo ciclo. Es la forma de hacer ráfagas: varios disparos de golpe.\n\nAlgo dentro del bucle tiene que acabar haciendo falsa la condición. Si un while da más de {vueltas} vueltas seguidas, salta BucleInfinitoException.\n\nUn while que dispara gasta balas y sube el calor en cada vuelta: pon municion() > 0 y un límite de calor en la condición.
manual.page.SYNTAX_WHILE.example.1=Ráfaga: dispara mientras haya alguien a tiro, queden balas y el calor esté por debajo de 80.
manual.page.SYNTAX_WHILE.example.2=Un contador: dispara 3 veces como mucho.
manual.page.SYNTAX_WHILE.example.3=Mal: no mira las balas. Dispara hasta vaciar el cargador y salta SinMunicionException.
manual.page.FAULTS_INTRO.title=Qué es una excepción
manual.page.FAULTS_INTRO.body=Una excepción es un fallo de tu código mientras se ejecuta: el código compila, pero en algún ciclo intenta algo imposible, como disparar sin balas.\n\nCuando salta una excepción:\n· el ciclo se corta en esa línea,\n· la torreta se queda colgada {cuelgue} s sin hacer nada,\n· encima de la torreta sale el nombre de la excepción y su línea,\n· y el Informe las cuenta por torreta y por línea.\n\nUna torreta colgada se puede recargar a mano haciendo clic en ella.\n\nCada excepción tiene su página en este capítulo: qué la provoca y cómo evitarla.
manual.page.FAULT_NO_AMMO.title=SinMunicionException
manual.page.FAULT_NO_AMMO.body=Salta cuando llamas a disparar() con el cargador vacío.\n\nEs la primera que verás: el código inicial, disparar();, vacía el cargador y luego sigue intentando disparar. Hasta que tengas if/else, recarga a mano haciendo clic en la torreta.\n\nPara evitarla, mira municion() antes de disparar y recarga cuando llegue a 0.\n\nSi ya has escrito el código para recargar y sigue saltando, revisa:\n· que lo has escrito en la pestaña de la torreta que falla: cada torreta tiene su propio código,\n· que compila, sin errores en rojo,\n· y que la oleada empezó después del cambio: la que está en marcha sigue con el código con el que empezó.
manual.page.FAULT_NO_AMMO.example.1=Esto provoca la excepción en cuanto se vacía el cargador.
manual.page.FAULT_NO_AMMO.example.2=La solución: recargar cuando no quedan balas.
manual.page.FAULT_OVERHEAT.title=SobrecalentamientoException
manual.page.FAULT_OVERHEAT.body=Salta cuando llamas a disparar() con el calor ya en {calorMax}.\n\nCon un disparo por ciclo no pasa nunca, porque el calor baja {disipacion} en cada ciclo. Pasa cuando disparas varias veces en el mismo ciclo: con varios disparar(); seguidos o dentro de un while.\n\nPara evitarla, mira calor() antes de cada disparo o pon un límite de calor en la condición del while.
manual.page.FAULT_OVERHEAT.example.1=Seis disparos seguidos: el sexto encuentra el calor al máximo.
manual.page.FAULT_OVERHEAT.example.2=La solución: mirar el calor antes de cada disparo.
manual.page.FAULT_NULL_POINTER.title=NullPointerException
manual.page.FAULT_NULL_POINTER.body=Salta cuando usas un enemigo que es null: apuntar(null), o preguntarle algo, como e.vida(), a una variable que vale null.\n\nenemigoMasCercano() y objetivo() devuelven null cuando no hay nadie, así que comprueba siempre e != null antes de usar lo que devuelven.
manual.page.FAULT_NULL_POINTER.example.1=Si no hay objetivo fijado, e vale null y apuntar(e) lanza la excepción.
manual.page.FAULT_NULL_POINTER.example.2=La solución: comprobar que no es null.
manual.page.FAULT_INFINITE_LOOP.title=BucleInfinitoException
manual.page.FAULT_INFINITE_LOOP.body=Salta cuando un while da más de {vueltas} vueltas seguidas. Casi siempre es una condición que nunca deja de cumplirse porque nada dentro del bucle la cambia.\n\nLa excepción marca la línea del while. Para evitarla, haz que el bucle cambie algo de lo que mira su condición: disparar() gasta balas y sube el calor, así que municion() > 0 o calor() < 80 acaban siendo falsos.
manual.page.FAULT_INFINITE_LOOP.example.1=Nada dentro del bucle sube el calor: la condición se cumple siempre.
manual.page.FAULT_INFINITE_LOOP.example.2=La solución: cada vuelta dispara, así que las balas y el calor cambian y el bucle termina.
manual.page.FAULT_ARITHMETIC.title=ArithmeticException
manual.page.FAULT_ARITHMETIC.body=Salta al dividir entre 0 o al calcular el resto de dividir entre 0 (con / o con %), igual que en Java.\n\nAntes de dividir entre algo que puede valer 0, compruébalo.
manual.page.FAULT_ARITHMETIC.example.1=Con el cargador vacío, n vale 0 y la división falla.
manual.page.FAULT_ARITHMETIC.example.2=La solución: dividir solo si n no es 0.
manual.page.ERRORS_COMMON.title=Errores al escribir
manual.page.ERRORS_COMMON.body=Si el código no compila, el editor marca la línea en rojo y explica el error. Los más habituales:\n\n· «Se esperaba ; ...»: falta el punto y coma al final de una instrucción.\n· «Se esperaba ) ...» o «... y hay el final del código»: falta cerrar un paréntesis o una llave.\n· «No existe la llamada ...»: el nombre está mal escrito. Revisa las mayúsculas: municion(), no Municion().\n· «Aún no has desbloqueado ...»: esa pieza o llamada todavía no es tuya. El mensaje dice con qué llega.\n· «Esto no es una instrucción...»: has escrito un valor suelto, como municion() == 0;, sin usarlo en un if.\n· «Puede que la variable ... aún no tenga valor»: dale un valor al declararla, por ejemplo int n = 0;\n· «Tipos incompatibles»: estás mezclando tipos, como guardar un enemigo en un int.\n· «Las asignaciones, ++ y -- van solas...»: escríbelas como instrucción propia, no dentro de una condición o de una cuenta.\n· «Memoria llena»: el código tiene más instrucciones de las que caben. Busca algo que se repita.\n\nMientras haya errores, la torreta sigue con la última versión que compilaba.
manual.page.ENEMY_BASIC.title=Básico
manual.page.ENEMY_BASIC.body=Sin trucos: avanza por el camino hasta el núcleo a {velocidad.BASIC} unidades por segundo. Aparece desde la oleada {oleada.BASIC}.\n\nPara pararlo basta con un código que recargue a tiempo y no dispare al aire.
manual.page.ENEMY_BASIC.example.1=Recarga cuando hace falta y no gasta balas al aire.
manual.page.ENEMY_REGENERATOR.title=Regenerador
manual.page.ENEMY_REGENERATOR.body=Tiene ×{vida.REGENERATOR} de vida y se cura si pasa {regenEspera} s sin recibir daño: recupera un {regenRitmo} % de su vida máxima por segundo. Va a {velocidad.REGENERATOR} unidades por segundo. Aparece desde la oleada {oleada.REGENERATOR}.\n\nSi repartes los disparos entre varios enemigos, le da tiempo a curarse. Fija un objetivo y no lo sueltes hasta acabar con él.
manual.page.ENEMY_REGENERATOR.example.1=Sigue disparando al mismo enemigo hasta que caiga.
manual.page.ENEMY_ARMORED.title=Blindado
manual.page.ENEMY_ARMORED.body=Lleva blindaje: la munición NORMAL le hace un {blindaje} % menos de daño. Tiene ×{vida.ARMORED} de vida y va a {velocidad.ARMORED} unidades por segundo. Aparece desde la oleada {oleada.ARMORED}.\n\nLa munición PERFORANTE le hace todo el daño, pero calienta más. Lo mejor es cambiar de munición según el enemigo con usarMunicion() y e.blindado().
manual.page.ENEMY_ARMORED.example.1=Perforante contra blindados y normal contra el resto.
manual.page.ENEMY_SWARM.title=Enjambre
manual.page.ENEMY_SWARM.body=Llega en grupos de {enjambre}, muy juntos y rápidos ({velocidad.SWARM} unidades por segundo), pero con poca vida: ×{vida.SWARM}. Aparece desde la oleada {oleada.SWARM}.\n\nUn disparo por ciclo no da abasto. Cuando un grupo está a tiro, dispara en ráfaga.
manual.page.ENEMY_SWARM.example.1=Ráfaga mientras haya alguien a tiro, sin vaciar el cargador ni pasarse de calor.
manual.page.ENEMY_BOSS.title=Jefe
manual.page.ENEMY_BOSS.body=Llega en la oleada {oleada.BOSS}. Tiene ×{vida.BOSS} de vida, va despacio ({velocidad.BOSS} unidades por segundo) y se pone y se quita el blindaje cada {jefeBlindaje} s. Si llega al núcleo, pierdes la oleada aunque al núcleo le queden vidas.\n\nNecesitas todo lo aprendido: fijarlo como objetivo, cambiar a perforante cuando lleve blindaje y disparar en ráfagas sin sobrecalentarte.
manual.page.ENEMY_BOSS.example.1=Un código completo: objetivo fijo, munición según el blindaje y ráfagas.
manual.page.RECIPE_NO_AIR.title=No disparar al aire
manual.page.RECIPE_NO_AIR.body=Lo primero que conviene escribir al comprar if/else. Recarga solo cuando el cargador está vacío y dispara solo cuando hay alguien a tiro. Ya no hace falta recargar a mano.
manual.page.RECIPE_NO_AIR.example.1=Pégalo en todas tus torretas.
manual.page.RECIPE_IDLE_RELOAD.title=Recargar en los ratos muertos
manual.page.RECIPE_IDLE_RELOAD.body=Recargar tarda lo mismo con el cargador a medias. Si no hay nadie a tiro y quedan pocas balas, aprovecha para recargar y empieza la siguiente tanda con el cargador lleno.
manual.page.RECIPE_IDLE_RELOAD.example.1=Recarga si está vacío, o si no hay nadie a tiro y quedan menos de 6 balas.
manual.page.RECIPE_FOCUS.title=Un enemigo cada vez
manual.page.RECIPE_FOCUS.body=Dispara siempre al mismo enemigo hasta que caiga o se salga del alcance. Imprescindible contra el Regenerador.
manual.page.RECIPE_FOCUS.example.1=Objetivo fijo, con recarga.
manual.page.RECIPE_ARMOR.title=Munición según el blindaje
manual.page.RECIPE_ARMOR.body=Desde la oleada {oleadaMunicion}. Perforante contra los enemigos blindados y normal contra el resto, para que el calor suba lo menos posible.
manual.page.RECIPE_ARMOR.example.1=Mira el blindaje del más cercano en cada ciclo.
manual.page.RECIPE_BURST.title=Ráfagas sin sobrecalentarse
manual.page.RECIPE_BURST.body=Varios disparos por ciclo mientras haya enemigos, sin vaciar el cargador y sin pasar de 80 de calor. Contra el Enjambre marca la diferencia.
manual.page.RECIPE_BURST.example.1=Recarga si hace falta y luego dispara en ráfaga.
manual.page.RECIPE_FULL.title=La torreta completa
manual.page.RECIPE_FULL.body=Todo junto: recarga, objetivo fijo, munición según el blindaje y ráfagas. Úsalo como punto de partida y ajústalo a tu manera.
manual.page.RECIPE_FULL.example.1=Ocupa toda la memoria: para añadir algo, tendrás que quitar otra cosa.
