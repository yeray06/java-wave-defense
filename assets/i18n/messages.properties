# Manual del jugador (fase 5b). Los textos de manual.page.* no pasan por MessageFormat:
# {nombre} es un número de los datos (ManualFacts). El código de los ejemplos vive en data/manual.json.
manual.intro=Todo lo que necesitas para programar tus torretas, aunque no hayas programado nunca. Empieza por «Empieza aquí». Cada ejemplo tiene un botón Copiar. Lo que todavía no tienes sale con candado, para que sepas qué viene.
manual.chapter.START=Empieza aquí
manual.chapter.WORDS=Símbolos y palabras
manual.chapter.TURRET=Órdenes de la torreta
manual.chapter.ENEMY_CALLS=Preguntas a un enemigo
manual.chapter.SYNTAX=Las piezas de la Tienda
manual.chapter.FAULTS=Fallos mientras juegas (excepciones)
manual.chapter.ERRORS=Fallos al escribir
manual.chapter.ENEMIES=Enemigos
manual.chapter.RECIPES=Recetas para copiar
manual.page.START_PROGRAM.title=Qué es programar
manual.page.START_PROGRAM.body=Programar es escribir una lista de órdenes. La torreta no piensa por su cuenta: hace exactamente lo que dice su código, de arriba abajo, y nada más.\n\nCada orden se llama instrucción. Por ejemplo, disparar(); le dice a la torreta que dispare una vez.\n\nFíjate en las tres partes de disparar();\n· disparar es el nombre de la orden. Se escribe tal cual: sin tildes, sin espacios y con las mayúsculas exactas.\n· ( ) son los paréntesis. Van siempre detrás del nombre, aunque estén vacíos.\n· ; es el punto y coma. Marca el final de la orden, como el punto al final de una frase.\n\nEl idioma en el que escribes se llama Java, y es un lenguaje de programación de verdad. No hace falta saber nada antes: empiezas con dos órdenes y cada pieza de la Tienda te enseña una más. Si escribes algo mal, el editor te dice en qué línea está el fallo y por qué.
manual.page.START_PROGRAM.example.1=Dos instrucciones. La torreta las hace en orden: primero dispara y luego recarga.
manual.page.START_CYCLE.title=Cómo piensa una torreta
manual.page.START_CYCLE.body=La torreta lee su código {ciclos} veces por segundo. Cada una de esas lecturas se llama ciclo.\n\nEn cada ciclo lee el código entero, de la primera línea a la última. En el siguiente ciclo vuelve a empezar desde arriba. Por eso una torreta que solo tiene disparar(); dispara una vez en cada ciclo, sin parar, haya enemigos o no.\n\nCosas que conviene saber:\n· Al empezar cada ciclo, la torreta se enfría {disipacion} de calor.\n· Lo que guardas en una variable se olvida al terminar el ciclo. La torreta solo recuerda el enemigo al que apuntas y la munición que eliges.\n· Un ciclo termina antes de tiempo si llamas a recargar() o si salta un fallo (una excepción).
manual.page.START_CYCLE.example.1=El código con el que empieza cada torreta: dispara una vez por ciclo, haya enemigos o no.
manual.page.START_FIRST_STEPS.title=Tus primeros pasos
manual.page.START_FIRST_STEPS.body=Un camino sencillo para empezar:\n\n1. En la oleada 1 la torreta solo sabe disparar(). Gasta las balas y se queda vacía. Haz clic en ella para recargarla a mano.\n2. Con la estrella de superar la oleada 1, compra «Decidir (if/else)» en la Tienda. Te enseña a elegir qué hacer según lo que pasa.\n3. Abre Código, borra lo que hay (Ctrl+A y luego escribe o pega) y pon el ejemplo de abajo. Ya no tendrás que recargar a mano y no gastarás balas al aire.\n4. Pulsa «Desplegar» en la siguiente oleada: el código nuevo entra al empezar una oleada.\n5. Lee el Informe al acabar cada oleada. Te dice qué ha fallado y en qué línea.\n\nDespués, cada pieza nueva de la Tienda tiene su página en «Las piezas de la Tienda», y en «Recetas para copiar» hay códigos completos.
manual.page.START_FIRST_STEPS.example.1=Tu primer código útil. Las líneas que empiezan por // son notas para ti: la torreta no las lee.
manual.page.START_EDITOR.title=El editor de código
manual.page.START_EDITOR.body=El editor se abre con el botón Código.\n\n· Cada torreta tiene su propia pestaña y su propio código. Si tienes dos torretas, escribe en las dos.\n· El juego revisa tu código mientras escribes. Si está bien, debajo pone «Compila». Si no, la línea del fallo se marca en rojo y debajo se explica qué pasa.\n· Mientras haya fallos en rojo, la torreta sigue usando la última versión que estaba bien.\n· El código nuevo entra en la próxima oleada, o en la que está esperando a «Desplegar». La oleada que ya está en marcha sigue con el código con el que empezó.\n· Las barras azules junto al número de línea marcan las instrucciones que ocupan memoria.\n\nAtajos: Ctrl+C copia, Ctrl+X corta, Ctrl+V pega, Ctrl+A selecciona todo, Ctrl+Z deshace, Ctrl+Y rehace y Tab mete espacios al principio de la línea.\n\nPara usar un ejemplo de este manual: pulsa Copiar, abre la pestaña de la torreta, pulsa Ctrl+A para seleccionar lo que había y pega con Ctrl+V.
manual.page.START_EDITOR.example.1=Lo que va detrás de // es un comentario: una nota para ti. El juego no lo lee y no ocupa memoria.
manual.page.START_MEMORY.title=La memoria
manual.page.START_MEMORY.body=Cada torreta tiene sitio para {memoria} instrucciones. Si tu código tiene más, no compila.\n\nLo que cuenta son las instrucciones, no las líneas que ves:\n· Ocupan sitio: cada orden como disparar();, cada variable nueva, cada vez que cambias el valor de una variable, cada if y cada while.\n· No ocupan nada: las llaves { }, else, los comentarios y las líneas en blanco.\n\nEscribirlo todo en una sola línea no ahorra memoria. Debajo de cada ejemplo del manual verás cuánta ocupa.
manual.page.START_MEMORY.example.1=Cinco líneas en pantalla, pero solo tres instrucciones: el if, recargar() y disparar(). Los números de los comentarios las cuentan.
manual.page.START_GAME.title=Cómo se juega
manual.page.START_GAME.body=Defiende el núcleo durante {oleadas} oleadas. La última trae al Jefe.\n\n· Antes de cada oleada nueva sale su parte: qué enemigos vienen y cuántos. Pulsa «Desplegar» cuando estés listo.\n· El núcleo aguanta {vidas} enemigos por oleada. Cada enemigo que llega le quita una vida; si se queda sin vidas, pierdes la oleada.\n· Cada oleada da hasta 3 estrellas, que se gastan en la Tienda: por superarla, por superarla sin que se cuele nadie y por cumplir su reto. Lo explica la página «Estrellas, retos y trofeos».\n· Si pierdes, no pierdes nada de lo comprado: vuelves a la oleada anterior para prepararte.\n· Con el avance automático encendido, la siguiente oleada empieza sola. Apagado, se repite la misma.\n· Las velocidades rápidas, hasta ×{velocidadMax}, solo se pueden usar en oleadas que ya has superado sin que se cuele nadie.\n· Haz clic en una torreta para recargarla a mano, aunque esté bloqueada por un fallo.\n· En el Mapa puedes volver a cualquier oleada a la que ya hayas llegado.\n· Al acabar cada oleada se abre el Informe: las estrellas, quién se coló y por dónde, y qué ha hecho cada torreta.\n· La partida se guarda sola. Los ajustes (tamaño de letra, pantalla completa) están en Ajustes.
manual.page.START_STARS.title=Estrellas, retos y trofeos
manual.page.START_STARS.body=Las estrellas son lo que gastas en la Tienda. Cada oleada tiene 3:\n\n✓ Superarla.\n✓ Superarla sin que se cuele ningún enemigo.\n✓ Cumplir su reto de código.\n\nCada estrella se gana una sola vez. Repetir una oleada no da nada si ya tienes sus estrellas. Si te falta alguna, vuelve a esa oleada desde el Mapa cuando estés más fuerte.\n\nEl reto sale en el parte de la oleada, antes de desplegar. Son cosas como «ningún disparo al aire» o «código de 4 líneas de memoria como mucho». Casi siempre piden cambiar tu código, no comprar más. Lo que dice el reto vale para todas tus torretas juntas. El Informe te dice si lo has cumplido y, si no, cuánto has hecho.\n\n¿Te has equivocado al comprar una mejora? En la Tienda puedes devolverla con «Devolver» y recuperas lo que costó, nivel a nivel. La sintaxis y la torreta extra no se devuelven. El Informe de una derrota te dice qué falló.\n\nLos trofeos solo los da un jefe, la primera vez que lo derrotas. Se gastarán en mejoras especiales en los próximos actos.
manual.page.START_SHOP.title=La Tienda
manual.page.START_SHOP.body=En la Tienda se compran dos tipos de cosas:\n\n· Piezas de programación: cada una te enseña algo nuevo y desbloquea órdenes nuevas. Van en orden: «Decidir (if/else)», «Recordar (variables)», «Combinar condiciones (&&, ||, !)» y «Repetir (while)». Al comprar una se abre una tarjeta con un ejemplo que funciona tal cual. Si usas algo que no has comprado, el editor dice «Aún no has desbloqueado...».\n· Mejoras: hacen más fuertes a todas tus torretas. El daño sube un {nivel.DAMAGE} % por nivel (cada bala hace {dano} de base), el cargador gana {nivel.MAGAZINE} balas por nivel y el disipador enfría {nivel.HEAT_SINK} de calor más por ciclo y nivel. También puedes comprar una torreta extra.\n\nLas mejoras tienen un tope hasta que compras ciertas piezas: la Tienda te dice cuál. Es a propósito: programar bien siempre rinde más que comprar mejoras.\n\nCon «Recorrer (for)» llegan dos mejoras más: la memoria, que da {nivel.MEMORY} líneas más por script y nivel, y el procesador, que hace que la torreta piense más veces por segundo. Y se pueden comprar la tercera y la cuarta torreta.\n\nUna mejora que no te sirve se puede devolver con «Devolver»: recuperas sus estrellas.
manual.page.WORDS_SYMBOLS.title=Los símbolos, uno a uno
manual.page.WORDS_SYMBOLS.body=Todos los símbolos que vas a usar, explicados:\n\n· ; punto y coma. Termina cada instrucción.\n· ( ) paréntesis. Van detrás de cada orden, como disparar(), y rodean la pregunta de un if o de un while.\n· { } llaves. Agrupan varias instrucciones en un bloque, como una caja.\n· // dos barras. Lo que va detrás, hasta el final de la línea, es un comentario: una nota para ti que el juego no lee. También vale /* nota */.\n· = un igual. Guarda un valor en una variable: balas = 0; quiere decir «ahora balas vale 0».\n· == dos iguales. Pregunta si dos cosas son iguales: municion() == 0 quiere decir «¿las balas son 0?». No lo confundas con un solo igual.\n· != distinto de. < menor que. > mayor que. <= menor o igual. >= mayor o igual.\n· && y: se cumplen las dos cosas.\n· || o: se cumple al menos una de las dos. (Son dos barras verticales; en el teclado español, AltGr + 1.)\n· ! no: da la vuelta a una pregunta. !hayEnemigos() quiere decir «no hay enemigos».\n· + sumar, - restar, * multiplicar, / dividir y % el resto de una división.\n· ++ suma 1 a una variable. -- resta 1. += suma la cantidad que pongas.\n· . el punto. Sirve para preguntarle algo a un enemigo: e.vida() es «la vida de e».
manual.page.WORDS_SYMBOLS.example.1=Un comentario y una instrucción con sus paréntesis y su punto y coma.
manual.page.WORDS_GLOSSARY.title=Palabras que vas a leer
manual.page.WORDS_GLOSSARY.body=· Instrucción: una orden, como disparar();.\n· Ciclo: cada vez que la torreta lee su código de arriba abajo ({ciclos} veces por segundo).\n· Bloque: varias instrucciones entre llaves { }.\n· Condición: una pregunta que se responde con sí o no, como municion() == 0.\n· true y false: sí y no, en inglés. Las condiciones valen true (se cumple) o false (no se cumple).\n· Variable: una caja con nombre para guardar un dato, como int balas = municion();.\n· int: un número entero (sin decimales). boolean: un sí o un no. Enemigo: un enemigo.\n· null: nada. Una variable de tipo Enemigo vale null cuando no hay ningún enemigo.\n· Compilar: lo que hace el juego al revisar tu código antes de usarlo. «Compila» quiere decir que está bien escrito.\n· Fallo al escribir: el código está mal escrito y no compila (por ejemplo, falta un punto y coma). Sale en rojo en el editor.\n· Excepción: el código está bien escrito, pero al ejecutarse hace algo imposible, como disparar sin balas. La torreta se bloquea un momento.\n· Memoria: cuántas instrucciones caben en una torreta ({memoria}).
manual.page.WORDS_READ_ALOUD.title=Cómo leer el código en voz alta
manual.page.WORDS_READ_ALOUD.body=Un truco para entender cualquier código: léelo como una frase en español.\n\n· if se lee «si». else se lee «si no». while se lee «mientras».\n· == se lee «es igual a», != «es distinto de», < «es menor que» y > «es mayor que».\n· && se lee «y», || se lee «o» y ! se lee «no».\n· Las llaves { } son «entonces haz esto».\n\nPor ejemplo, if (municion() == 0) recargar(); se lee: «si las balas son igual a cero, recarga».\n\nY while (hayEnemigos() && calor() < 80) disparar(); se lee: «mientras haya enemigos y el calor sea menor que 80, dispara».\n\nSi al leerlo en voz alta la frase no tiene sentido, seguramente el código tampoco hace lo que quieres.
manual.page.WORDS_READ_ALOUD.example.1=Léelo así: si no hay balas, o no hay nadie y quedan menos de 6, entonces recarga.
manual.page.CALL_FIRE.title=disparar() · dispara una bala
manual.page.CALL_FIRE.body=Dispara una bala. Gasta una bala del cargador y calienta la torreta {calorNormal} ({calorPerforante} con munición perforante).\n\n¿A quién dispara? Al enemigo al que apuntas con apuntar(e), si sigue vivo y a tiro. Si no, al enemigo más cercano a la torreta que esté a tiro (a {alcance} de distancia o menos).\n\nSi no hay nadie a tiro, la bala se pierde en el aire, pero gasta la bala y el calor igual.\n\nPuedes ponerlo varias veces seguidas para disparar varias balas en el mismo ciclo, pero cada una calienta la torreta.\n\nPuede fallar de dos formas:\n· Sin balas: salta SinMunicionException.\n· Con el calor al máximo ({calorMax}): salta SobrecalentamientoException.
manual.page.CALL_FIRE.example.1=Una bala en cada ciclo. Es el código con el que empieza cada torreta.
manual.page.CALL_FIRE.example.2=Tres balas en el mismo ciclo: el triple de daño, pero el calor sube más rápido de lo que baja y acaba fallando por sobrecalentamiento.
manual.page.CALL_RELOAD.title=recargar() · llena el cargador
manual.page.CALL_RELOAD.body=Recarga el cargador. La torreta se queda quieta {ciclosRecarga} ciclos y vuelve con el cargador lleno ({cargador} balas sin mejoras). Mientras recarga, se sigue enfriando.\n\nImportante: recargar() termina el ciclo justo ahí. Lo que haya escrito debajo no se hace en ese ciclo.\n\nRecargar con el cargador a medias tarda lo mismo. Lo mejor es recargar cuando está vacío o cuando no hay enemigos cerca.\n\nHasta que compres «Decidir (if/else)» no puedes saber cuántas balas quedan, así que recarga a mano haciendo clic en la torreta.
manual.page.CALL_RELOAD.example.1=La segunda línea nunca se hace: recargar() termina el ciclo. Esta torreta se pasaría la partida recargando.
manual.page.CALL_RELOAD.example.2=Si las balas son cero, recarga; si no, dispara.
manual.page.CALL_AMMO.title=municion() · cuántas balas quedan
manual.page.CALL_AMMO.body=Te dice cuántas balas quedan en el cargador: un número entre 0 y el tamaño del cargador ({cargador} sin mejoras).\n\nSirve para recargar justo cuando hace falta y para no disparar con el cargador vacío, que es un fallo (SinMunicionException).\n\nSe usa dentro de una pregunta, por ejemplo municion() == 0, que quiere decir «¿las balas son cero?».
manual.page.CALL_AMMO.example.1=El código más útil del juego: recarga cuando no quedan balas y dispara solo si hay alguien a tiro.
manual.page.CALL_HEAT.title=calor() · cuánto se ha calentado
manual.page.CALL_HEAT.body=Te dice el calor de la torreta: un número entre 0 y {calorMax}.\n\n· Cada disparo calienta {calorNormal} ({calorPerforante} con munición perforante).\n· Al empezar cada ciclo se enfría {disipacion} (más si mejoras el disipador).\n· Si disparas con el calor ya en {calorMax}, la torreta falla (SobrecalentamientoException).\n\nCon un disparo por ciclo nunca llega a fallar. Vigila el calor cuando dispares varias veces en el mismo ciclo.
manual.page.CALL_HEAT.example.1=Dispara solo si el calor no está al máximo, así nunca falla por sobrecalentamiento.
manual.page.CALL_HAS_ENEMIES.title=hayEnemigos() · si hay alguien a tiro
manual.page.CALL_HAS_ENEMIES.body=Te dice si hay algún enemigo a tiro (a {alcance} de distancia o menos). Responde true (sí) o false (no).\n\nEs la forma más sencilla de no disparar al aire.
manual.page.CALL_HAS_ENEMIES.example.1=Dispara solo si hay alguien a tiro. Ojo: no recarga, así que cuando se vacíe el cargador fallará por falta de balas.
manual.page.CALL_NEAREST_ENEMY.title=enemigoMasCercano() · el enemigo más cercano
manual.page.CALL_NEAREST_ENEMY.body=Te da el enemigo más cercano a esta torreta que esté a tiro. Si no hay ninguno, te da null (nada).\n\nLo normal es guardarlo en una variable de tipo Enemigo para usarlo después. Antes de usarlo, comprueba que no es null: usar «nada» es un fallo (NullPointerException).\n\nNecesitas «Recordar (variables)».
manual.page.CALL_NEAREST_ENEMY.example.1=Apunta al más cercano y dispara. Si no hay nadie a tiro, no hace nada.
manual.page.CALL_TARGET.title=objetivo() · a quién estás apuntando
manual.page.CALL_TARGET.body=Te da el enemigo al que apuntaste con apuntar(e). Te da null (nada) si:\n· todavía no has apuntado a ninguno,\n· el que apuntaste ha muerto,\n· o se ha ido fuera de tu alcance.\n\nSirve para seguir disparando al mismo enemigo hasta acabar con él, en vez de cambiar de enemigo en cada ciclo.
manual.page.CALL_TARGET.example.1=Sigue con el mismo enemigo hasta acabar con él. Cuando no hay ninguno, apunta al más cercano.
manual.page.CALL_ENEMIES.title=enemigos() · la lista de enemigos a tiro
manual.page.CALL_ENEMIES.body=Te da una lista con todos los enemigos que están a tiro de esta torreta ahora mismo, en el orden en que salieron. Si no hay nadie, la lista está vacía (no es null).\n\nCon una lista puedes saber cuántos hay con size(), coger uno con get(número) o mirarlos todos, uno detrás de otro, con «Recorrer (for)».\n\nNecesitas «Recorrer (for)».
manual.page.CALL_ENEMIES.example.1=Dispara solo si hay 3 enemigos o más a tiro.
manual.page.CALL_ENEMIES.example.2=Mira a cada enemigo y apunta a uno con blindaje si lo hay.
manual.page.CALL_AIM.title=apuntar(e) · elige a quién disparar
manual.page.CALL_AIM.body=Le dice a la torreta a qué enemigo disparar. Desde ese momento, disparar() va contra ese enemigo mientras siga vivo y a tiro.\n\nLa torreta lo recuerda de un ciclo al siguiente: no hace falta apuntar otra vez en cada ciclo. Puedes saber a quién apuntas con objetivo().\n\nEntre los paréntesis va el enemigo, normalmente una variable. Si esa variable vale null (nada), la torreta falla (NullPointerException).
manual.page.CALL_AIM.example.1=Comprueba que hay alguien antes de apuntar.
manual.page.CALL_AIM.example.2=Mal: si no hay nadie a tiro, e vale null y apuntar(e) falla.
manual.page.CALL_USE_AMMO.title=usarMunicion(tipo) · elige la munición
manual.page.CALL_USE_AMMO.body=Elige qué balas dispara la torreta. Llega en la oleada {oleadaMunicion}, sin comprar nada.\n\n· NORMAL: las de siempre. Calientan {calorNormal} por disparo. A los enemigos blindados les hacen un {blindaje} % menos de daño.\n· PERFORANTE: atraviesan el blindaje y hacen todo el daño. Calientan {calorPerforante} por disparo.\n\nLa torreta recuerda la elección hasta que la cambies. Cada oleada empieza con NORMAL.
manual.page.CALL_USE_AMMO.example.1=Dispara siempre balas perforantes.
manual.page.ENEMY_TYPE.title=Guardar un enemigo en una variable
manual.page.ENEMY_TYPE.body=Con «Recordar (variables)» puedes guardar un enemigo con un nombre para usarlo después:\nEnemigo e = enemigoMasCercano();\nEso se lee: «guarda en e al enemigo más cercano».\n\n· Si no hay ningún enemigo, e vale null (nada). Pregúntalo con e == null (¿no hay nada?) o e != null (¿hay alguien?).\n· Con == también sabes si dos enemigos son el mismo.\n· A un enemigo le puedes preguntar cosas con un punto: e.vida(), e.velocidad(), e.blindado() y e.distanciaAlNucleo().\n· Si le preguntas algo a null, la torreta falla (NullPointerException).\n\nLas variables se olvidan al acabar el ciclo. Para seguir con el mismo enemigo en el siguiente ciclo, usa apuntar(e) y objetivo().
manual.page.ENEMY_TYPE.example.1=Los tres casos: no hay nadie, ya le estás apuntando o hay que apuntarle.
manual.page.CALL_HEALTH.title=e.vida() · cuánta vida le queda
manual.page.CALL_HEALTH.body=Te dice la vida que le queda al enemigo. Un enemigo vivo nunca da 0.\n\nLa vida de los enemigos crece en cada oleada, y algunos tienen más: el Regenerador y el Blindado ×{vida.REGENERATOR}, el Jefe ×{vida.BOSS}. Cada bala hace {dano} de daño sin mejoras.
manual.page.CALL_HEALTH.example.1=Si el enemigo más cercano tiene menos vida que el que apuntas, cambia a él para rematarlo antes.
manual.page.CALL_SPEED.title=e.velocidad() · lo rápido que va
manual.page.CALL_SPEED.body=Te dice lo rápido que va el enemigo. Cada tipo tiene su velocidad y no cambia:\n· Básico: {velocidad.BASIC}\n· Regenerador: {velocidad.REGENERATOR}\n· Blindado: {velocidad.ARMORED}\n· Enjambre: {velocidad.SWARM}\n· Jefe: {velocidad.BOSS}\n\nSirve para saber qué tipo de enemigo es o para atacar primero a los rápidos.
manual.page.CALL_SPEED.example.1=Apunta primero a los enemigos rápidos, como el Enjambre.
manual.page.CALL_ARMORED.title=e.blindado() · si lleva blindaje
manual.page.CALL_ARMORED.body=Te dice si el enemigo lleva blindaje ahora mismo: true (sí) o false (no).\n\nLas balas NORMAL le hacen un {blindaje} % menos de daño a un enemigo blindado; las PERFORANTE le hacen todo. El Blindado siempre lo lleva. El Jefe se lo pone y se lo quita cada {jefeBlindaje} segundos, así que conviene preguntarlo en cada ciclo.
manual.page.CALL_ARMORED.example.1=Balas perforantes solo contra blindados: el resto del tiempo la torreta se calienta menos.
manual.page.CALL_DISTANCE_TO_CORE.title=e.distanciaAlNucleo() · lo cerca que está del núcleo
manual.page.CALL_DISTANCE_TO_CORE.body=Te dice cuánto le falta al enemigo para llegar al núcleo. El camino entero mide {camino}.\n\nCuanto más pequeño el número, más peligroso: ese enemigo está a punto de quitarle una vida al núcleo.
manual.page.CALL_DISTANCE_TO_CORE.example.1=Si el enemigo más cercano está a menos de 300 del núcleo, deja lo que estés haciendo y ve a por él.
manual.page.SYNTAX_BASICS.title=Lo que sabes desde el principio
manual.page.SYNTAX_BASICS.body=Antes de comprar nada ya puedes escribir:\n· Las órdenes disparar(); y recargar();.\n· Comentarios: notas para ti detrás de // o entre /* y */.\n\nReglas que siempre se cumplen:\n· Cada instrucción termina en punto y coma.\n· Los paréntesis van siempre, aunque estén vacíos: disparar(); y no disparar;\n· Las mayúsculas importan: Disparar(); no existe.\n· No hay textos entre comillas ni números con decimales; solo números enteros.\n\nTodo lo que el juego acepta también lo acepta Java de verdad: lo que aprendes aquí sirve fuera del juego.
manual.page.SYNTAX_BASICS.example.1=Dos formas de escribir comentarios.
manual.page.SYNTAX_IF_ELSE.title=Decidir (if/else)
manual.page.SYNTAX_IF_ELSE.body=Sirve para que la torreta haga una cosa u otra según lo que pase. Se lee así:\n· if (pregunta) { ... } = «si pasa esto, haz lo de dentro».\n· else { ... } = «si no, haz esto otro».\n· else if (otra pregunta) { ... } = «si no, pero pasa esto otro, haz esto».\nSolo se hace el primer bloque cuya pregunta se cumpla.\n\nLa pregunta va entre paréntesis y compara cosas:\n· == igual, != distinto, < menor, > mayor, <= menor o igual, >= mayor o igual.\n· Ojo: para preguntar «¿es igual?» se usan dos iguales (==). Un solo igual (=) sirve para otra cosa.\n\nAlgunas órdenes ya responden sí o no, como hayEnemigos(), y se ponen tal cual: if (hayEnemigos()).\n\nLas llaves { } agrupan lo que hay que hacer. Si solo hay una instrucción, se pueden quitar, pero con llaves es más difícil equivocarse.\n\nCon esta pieza también desbloqueas municion(), calor() y hayEnemigos().
manual.page.SYNTAX_IF_ELSE.example.1=Si hay alguien a tiro, dispara.
manual.page.SYNTAX_IF_ELSE.example.2=Si no quedan balas, recarga; si no, dispara.
manual.page.SYNTAX_IF_ELSE.example.3=Varias preguntas seguidas: solo se hace la primera que se cumple. Un bloque puede quedarse vacío.
manual.page.SYNTAX_IF_ELSE.example.4=Lo mismo sin llaves: vale cuando cada caso es una sola instrucción.
manual.page.SYNTAX_VARIABLES.title=Recordar (variables)
manual.page.SYNTAX_VARIABLES.body=Una variable es una caja con nombre donde guardas un dato para usarlo después.\n\nPara crearla se escribe el tipo, el nombre, un igual y el valor:\nint balas = municion();\nEso se lee: «crea una caja de números llamada balas y mete dentro las balas que quedan».\n\nTipos de caja:\n· int: un número entero, como 3 o -20.\n· boolean: un sí o un no (true o false).\n· Enemigo: un enemigo, o null si no hay ninguno.\n\nPara cambiar lo que guarda, se escribe el nombre, un igual y el valor nuevo, sin repetir el tipo: balas = 0;\n\nCuentas con números: + suma, - resta, * multiplica, / divide y % da el resto. Las divisiones no tienen decimales: 7 / 2 da 3. Dividir entre 0 es un fallo (ArithmeticException).\n\nAtajos: n++ suma 1, n-- resta 1, n += 5 suma 5. Van siempre solos, en su propia línea.\n\nLas variables se vacían al empezar cada ciclo. Con esta pieza también desbloqueas enemigoMasCercano(), objetivo(), apuntar(e) y las preguntas a los enemigos.
manual.page.SYNTAX_VARIABLES.example.1=Guarda lo que vas a usar con un nombre que se entienda.
manual.page.SYNTAX_VARIABLES.example.2=Decide cuántas veces disparar y recarga si no hay balas para todas.
manual.page.SYNTAX_VARIABLES.example.3=Cuentas con números. Este no dispara: solo enseña cómo se escriben.
manual.page.SYNTAX_LOGIC_OPS.title=Combinar condiciones (&&, ||, !)
manual.page.SYNTAX_LOGIC_OPS.body=Sirven para hacer preguntas con varias partes:\n· && significa «y»: se cumplen las dos cosas. hayEnemigos() && calor() < 80 es «hay enemigos y el calor es menor que 80».\n· || significa «o»: se cumple al menos una. municion() == 0 || calor() > 90 es «no quedan balas o el calor pasa de 90».\n· ! significa «no»: da la vuelta a la pregunta. !hayEnemigos() es «no hay enemigos».\n\nUsa paréntesis para dejar claro qué va con qué, como en las cuentas: a || (b && c).\n\nTruco útil: con &&, si la primera parte no se cumple, la segunda ni se mira. Por eso e != null && e.vida() > 10 es seguro: si no hay enemigo, nunca le pregunta la vida.
manual.page.SYNTAX_LOGIC_OPS.example.1=Dispara solo si hay alguien a tiro y el calor es menor que 80.
manual.page.SYNTAX_LOGIC_OPS.example.2=Si no hay nadie, aprovecha para recargar cuando quedan pocas balas.
manual.page.SYNTAX_LOGIC_OPS.example.3=Primero comprueba que hay enemigo y, solo entonces, le pregunta la vida.
manual.page.SYNTAX_WHILE.title=Repetir (while)
manual.page.SYNTAX_WHILE.body=while repite un bloque mientras se cumpla una pregunta. Se lee «mientras pase esto, haz lo de dentro».\n\nAntes de cada vuelta vuelve a hacer la pregunta. Cuando deja de cumplirse, sigue con lo que haya debajo.\n\nTodas las vueltas pasan dentro del mismo ciclo. Es la forma de hacer ráfagas: varios disparos de golpe.\n\nCuidado: algo dentro tiene que acabar haciendo que la pregunta deje de cumplirse. Si da más de {vueltas} vueltas seguidas, la torreta falla (BucleInfinitoException).\n\nCada disparo dentro de un while gasta balas y calienta la torreta: incluye municion() > 0 y un límite de calor en la pregunta.
manual.page.SYNTAX_WHILE.example.1=Ráfaga: dispara mientras haya alguien, queden balas y el calor sea menor que 80.
manual.page.SYNTAX_WHILE.example.2=Un contador: dispara 3 veces como mucho.
manual.page.SYNTAX_WHILE.example.3=Mal: no mira las balas. Dispara hasta vaciar el cargador y falla.
manual.page.SYNTAX_FOR.title=Recorrer (for)
manual.page.SYNTAX_FOR.body=for repite un bloque, como while, pero tiene dos formas muy cómodas.\n\n1. Recorrer una lista: for (Enemigo e : enemigos()) { … } se lee «para cada enemigo e de la lista, haz lo de dentro». El bloque se repite una vez por enemigo, y en cada vuelta e es uno distinto.\n\n2. Contar: for (int i = 0; i < 3; i++) { … } tiene tres partes separadas por ; (punto y coma):\n· int i = 0 se hace una vez, al principio: crea el contador.\n· i < 3 es la pregunta, antes de cada vuelta: si no se cumple, se acaba.\n· i++ se hace al final de cada vuelta: suma 1.\nAsí el bloque se repite con i valiendo 0, 1 y 2: tres veces.\n\nLa i solo existe dentro del for. Todo el for ocupa una línea de memoria, más lo que haya dentro.\n\nComo con while, si da más de {vueltas} vueltas, la torreta falla (BucleInfinitoException).
manual.page.SYNTAX_FOR.example.1=Recorre la lista y apunta al enemigo rápido.
manual.page.SYNTAX_FOR.example.2=Cuenta hasta 3: una ráfaga de tres disparos como mucho.
manual.page.SYNTAX_FOR.example.3=Mal: falta el i++ y la pregunta nunca deja de cumplirse.
manual.page.SYNTAX_LISTS.title=Listas: List<Enemigo>
manual.page.SYNTAX_LISTS.body=Una lista guarda varios enemigos en orden. Su tipo se escribe List<Enemigo>: «lista de enemigos».\n\nLo que se le puede preguntar:\n· size(): cuántos hay.\n· get(n): el que está en la posición n. Ojo: se cuenta desde 0, así que el primero es get(0) y el último es get(size() - 1).\n· isEmpty(): true si no hay ninguno.\n\nPedir una posición que no existe es un fallo (IndexOutOfBoundsException).\n\nNecesitas «Recorrer (for)».
manual.page.SYNTAX_LISTS.example.1=Guarda la lista en una variable y apunta al primero, si hay alguno.
manual.page.SYNTAX_LISTS.example.2=El último está en size() - 1.
manual.page.FAULTS_INTRO.title=Qué es una excepción
manual.page.FAULTS_INTRO.body=Una excepción es un fallo que pasa mientras la torreta juega: el código está bien escrito, pero en algún ciclo intenta algo imposible, como disparar sin balas.\n\nCuando pasa:\n· la torreta se para en esa línea,\n· se queda bloqueada {cuelgue} segundos sin hacer nada,\n· encima de la torreta sale el nombre del fallo y su línea,\n· y el Informe lo apunta.\n\nUna torreta bloqueada se puede recargar a mano haciendo clic en ella.\n\nCada excepción tiene su página: qué la provoca y cómo evitarla.
manual.page.FAULT_NO_AMMO.title=SinMunicionException · disparar sin balas
manual.page.FAULT_NO_AMMO.body=Pasa cuando llamas a disparar() con el cargador vacío.\n\nEs la primera que verás: el código inicial, disparar();, gasta todas las balas y luego sigue intentando disparar. Hasta que tengas «Decidir (if/else)», recarga a mano haciendo clic en la torreta.\n\nPara evitarla, mira municion() antes de disparar y recarga cuando llegue a 0.\n\nSi ya escribiste el código para recargar y sigue pasando, revisa:\n· que lo escribiste en la pestaña de la torreta que falla: cada torreta tiene su propio código,\n· que compila (sin nada en rojo),\n· y que la oleada empezó después del cambio: la que está en marcha sigue con el código antiguo.
manual.page.FAULT_NO_AMMO.example.1=Esto falla en cuanto se vacía el cargador.
manual.page.FAULT_NO_AMMO.example.2=La solución: recargar cuando no quedan balas.
manual.page.FAULT_OVERHEAT.title=SobrecalentamientoException · la torreta se calienta demasiado
manual.page.FAULT_OVERHEAT.body=Pasa cuando llamas a disparar() con el calor ya en {calorMax}.\n\nCon un disparo por ciclo no pasa nunca, porque la torreta se enfría {disipacion} en cada ciclo. Pasa cuando disparas varias veces en el mismo ciclo.\n\nPara evitarla, mira calor() antes de cada disparo, o pon un límite de calor en la pregunta del while.
manual.page.FAULT_OVERHEAT.example.1=Seis disparos seguidos: el sexto encuentra el calor al máximo.
manual.page.FAULT_OVERHEAT.example.2=La solución: mirar el calor antes de cada disparo.
manual.page.FAULT_NULL_POINTER.title=NullPointerException · usar un enemigo que no existe
manual.page.FAULT_NULL_POINTER.body=Pasa cuando usas un enemigo que vale null (nada): apuntar a nada o preguntarle algo a nada, como e.vida().\n\nenemigoMasCercano() y objetivo() te dan null cuando no hay nadie, así que comprueba siempre que e != null antes de usarlo.
manual.page.FAULT_NULL_POINTER.example.1=Si no estás apuntando a nadie, e vale null y apuntar(e) falla.
manual.page.FAULT_NULL_POINTER.example.2=La solución: comprobar que hay alguien.
manual.page.FAULT_INFINITE_LOOP.title=BucleInfinitoException · un while que no termina
manual.page.FAULT_INFINITE_LOOP.body=Pasa cuando un while da más de {vueltas} vueltas seguidas. Casi siempre es una pregunta que nunca deja de cumplirse, porque nada dentro del bucle la cambia.\n\nEl fallo marca la línea del while. Para evitarlo, haz que lo de dentro cambie algo de lo que mira la pregunta: disparar() gasta balas y calienta, así que municion() > 0 o calor() < 80 acaban dejando de cumplirse.
manual.page.FAULT_INFINITE_LOOP.example.1=Dentro del bucle no hay nada que suba el calor: la pregunta se cumple siempre.
manual.page.FAULT_INFINITE_LOOP.example.2=La solución: cada vuelta dispara, así que las balas y el calor cambian y el bucle termina.
manual.page.FAULT_ARITHMETIC.title=ArithmeticException · dividir entre cero
manual.page.FAULT_ARITHMETIC.body=Pasa al dividir entre 0 (con / o con %), igual que en una calculadora.\n\nAntes de dividir entre algo que puede valer 0, compruébalo.
manual.page.FAULT_ARITHMETIC.example.1=Con el cargador vacío, n vale 0 y la división falla.
manual.page.FAULT_ARITHMETIC.example.2=La solución: dividir solo si n no es 0.
manual.page.FAULT_INDEX_OUT_OF_BOUNDS.title=IndexOutOfBoundsException · fuera de la lista
manual.page.FAULT_INDEX_OUT_OF_BOUNDS.body=Pasa al pedir con get(n) una posición que la lista no tiene: un número negativo, o size() o más.\n\nCon 3 enemigos, las posiciones son 0, 1 y 2. get(3) ya no existe. Y si la lista está vacía, no existe ni get(0).
manual.page.FAULT_INDEX_OUT_OF_BOUNDS.example.1=Mal: si no hay nadie a tiro, no hay posición 0.
manual.page.FAULT_INDEX_OUT_OF_BOUNDS.example.2=Bien: comprueba antes que la lista no está vacía.
manual.page.ERRORS_COMMON.title=Fallos al escribir
manual.page.ERRORS_COMMON.body=Si el código está mal escrito, el editor marca la línea en rojo y explica el fallo. Los más habituales:\n\n· «Se esperaba ;...»: falta el punto y coma al final de una instrucción.\n· «Se esperaba )...» o «...y hay el final del código»: falta cerrar un paréntesis o una llave. Cuenta que haya tantos ( como ) y tantos { como }.\n· «No existe la llamada...»: el nombre está mal escrito. Revisa las mayúsculas: municion(), no Municion().\n· «Aún no has desbloqueado...»: esa pieza u orden todavía no es tuya. El mensaje dice qué pieza la trae.\n· «Esto no es una instrucción...»: has escrito una pregunta suelta, como municion() == 0;, sin un if delante.\n· «Puede que la variable... aún no tenga valor»: dale un valor al crearla, por ejemplo int n = 0;\n· «Tipos incompatibles»: estás mezclando cajas, como meter un enemigo en una variable de números.\n· «Las asignaciones, ++ y -- van solas...»: escríbelas en su propia línea, no dentro de una pregunta.\n· «Memoria llena»: hay más instrucciones de las que caben. Busca algo que se repita.\n\nMientras haya fallos, la torreta sigue con la última versión que estaba bien.
manual.page.ENEMY_BASIC.title=Básico
manual.page.ENEMY_BASIC.body=Sin trucos: va por el camino hacia el núcleo a {velocidad.BASIC} de velocidad. Aparece desde la oleada {oleada.BASIC}.\n\nPara pararlo basta con un código que recargue a tiempo y no dispare al aire.
manual.page.ENEMY_BASIC.example.1=Recarga cuando hace falta y no gasta balas al aire.
manual.page.ENEMY_REGENERATOR.title=Regenerador
manual.page.ENEMY_REGENERATOR.body=Tiene ×{vida.REGENERATOR} de vida y se cura si pasa {regenEspera} segundo sin recibir daño: recupera un {regenRitmo} % de su vida por segundo. Va a {velocidad.REGENERATOR} de velocidad. Aparece desde la oleada {oleada.REGENERATOR}.\n\nSi repartes los disparos entre varios enemigos, le da tiempo a curarse. Elige uno con apuntar(e) y no lo sueltes hasta acabar con él.
manual.page.ENEMY_REGENERATOR.example.1=Sigue disparando al mismo enemigo hasta que caiga.
manual.page.ENEMY_ARMORED.title=Blindado
manual.page.ENEMY_ARMORED.body=Lleva blindaje: las balas NORMAL le hacen un {blindaje} % menos de daño. Tiene ×{vida.ARMORED} de vida y va a {velocidad.ARMORED} de velocidad. Aparece desde la oleada {oleada.ARMORED}.\n\nLas balas PERFORANTE le hacen todo el daño, pero calientan más. Lo mejor es cambiar de balas según el enemigo con usarMunicion() y e.blindado().
manual.page.ENEMY_ARMORED.example.1=Balas perforantes contra blindados y normales contra el resto.
manual.page.ENEMY_SWARM.title=Enjambre
manual.page.ENEMY_SWARM.body=Llega en grupos de {enjambre}, muy juntos y rápidos ({velocidad.SWARM} de velocidad), pero con poca vida: ×{vida.SWARM}. Aparece desde la oleada {oleada.SWARM}.\n\nUn disparo por ciclo no da abasto. Cuando un grupo esté a tiro, dispara en ráfaga con «Repetir (while)».
manual.page.ENEMY_SWARM.example.1=Ráfaga mientras haya alguien a tiro, sin vaciar el cargador ni pasarse de calor.
manual.page.ENEMY_RUNNER.title=Corredor
manual.page.ENEMY_RUNNER.body=Va muy rápido: {velocidad.RUNNER} de velocidad, el triple que un Básico. Tiene vida ×{vida.RUNNER}. Aparece desde la oleada {oleada.RUNNER}.\n\nMientras tu torreta dispara a otro, el Corredor se cuela. enemigoMasCercano() te da el más cercano a la torreta, no el más peligroso. Con «Recorrer (for)» puedes mirar a todos y elegir al que está más cerca del núcleo.
manual.page.ENEMY_RUNNER.example.1=Elige al enemigo que está más cerca del núcleo y dispara.
manual.page.ENEMY_BOSS.title=Jefe
manual.page.ENEMY_BOSS.body=Llega en la oleada {oleada.BOSS}. Tiene ×{vida.BOSS} de vida, va despacio ({velocidad.BOSS} de velocidad) y se pone y se quita el blindaje cada {jefeBlindaje} segundos. Si llega al núcleo, pierdes la oleada aunque al núcleo le queden vidas.\n\nNecesitas todo lo aprendido: apuntarle y no soltarlo, cambiar a balas perforantes cuando lleve blindaje y disparar en ráfagas sin calentarte demasiado.
manual.page.ENEMY_BOSS.example.1=Un código completo: apunta y no suelta, elige balas según el blindaje y dispara en ráfagas.
manual.page.RECIPE_NO_AIR.title=No disparar al aire
manual.page.RECIPE_NO_AIR.body=Lo primero que conviene escribir al comprar «Decidir (if/else)». Recarga solo cuando el cargador está vacío y dispara solo si hay alguien a tiro. Ya no hace falta recargar a mano.
manual.page.RECIPE_NO_AIR.example.1=Pégalo en todas tus torretas.
manual.page.RECIPE_IDLE_RELOAD.title=Recargar en los ratos muertos
manual.page.RECIPE_IDLE_RELOAD.body=Recargar tarda lo mismo con el cargador a medias. Si no hay nadie a tiro y quedan pocas balas, aprovecha para recargar y empieza la siguiente tanda con el cargador lleno.
manual.page.RECIPE_IDLE_RELOAD.example.1=Recarga si está vacío, o si no hay nadie a tiro y quedan menos de 6 balas.
manual.page.RECIPE_FOCUS.title=Un enemigo cada vez
manual.page.RECIPE_FOCUS.body=Dispara siempre al mismo enemigo hasta que caiga o se vaya fuera de alcance. Imprescindible contra el Regenerador.
manual.page.RECIPE_FOCUS.example.1=Apunta y no suelta, y recarga cuando hace falta.
manual.page.RECIPE_ARMOR.title=Balas según el blindaje
manual.page.RECIPE_ARMOR.body=Desde la oleada {oleadaMunicion}. Balas perforantes contra los blindados y normales contra el resto, para calentarte lo menos posible.
manual.page.RECIPE_ARMOR.example.1=Mira el blindaje del más cercano en cada ciclo.
manual.page.RECIPE_BURST.title=Ráfagas sin calentarse
manual.page.RECIPE_BURST.body=Varios disparos por ciclo mientras haya enemigos, sin vaciar el cargador y sin pasar de 80 de calor. Contra el Enjambre marca la diferencia.
manual.page.RECIPE_BURST.example.1=Recarga si hace falta y luego dispara en ráfaga.
manual.page.RECIPE_FULL.title=La torreta completa
manual.page.RECIPE_FULL.body=Todo junto: recarga, apunta y no suelta, elige balas según el blindaje y dispara en ráfagas. Úsalo como punto de partida y cámbialo a tu manera.
manual.page.RECIPE_FULL.example.1=Ocupa toda la memoria: para añadir algo, tendrás que quitar otra cosa.
manual.page.RECIPE_CLOSEST_TO_CORE.title=El más peligroso primero
manual.page.RECIPE_CLOSEST_TO_CORE.body=Mira a todos los enemigos a tiro y dispara al que está más cerca del núcleo. Es la respuesta al Corredor.
manual.page.RECIPE_CLOSEST_TO_CORE.example.1=Recarga si hace falta, busca al más avanzado y dispara.
